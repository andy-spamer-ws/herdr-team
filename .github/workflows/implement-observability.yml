name: Implement and review observability

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: herdr-team-observability-observe
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      copilot-requests: write
    outputs:
      baseline_sha: ${{ steps.baseline.outputs.sha }}
      head_sha: ${{ steps.package.outputs.sha }}

    steps:
      - name: Check out observe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: observe
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: |
          npm install --global @github/copilot@1.0.80
          copilot version

      - name: Prepare agents and baseline
        id: baseline
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "observe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Agent 1 - implement observability
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PROMPT="$(cat <<EOF
          You are Agent 1, the implementation owner. Work only in the current checkout of
          the observe branch, whose immutable baseline is ${BASE_SHA}.

          Review docs/agent-traceability-design-assessment.md against the current repository,
          then implement its observability design completely. Resolve its open decisions
          conservatively, preferring the proposed options unless current code provides evidence
          for a safer choice. Treat acceptance criteria A1-A11 and tests T1-T24 as the definition
          of done. Preserve existing behaviour and add no non-stdlib runtime dependency.

          Use atomic commits that each change and prove exactly one testable outcome:
          - work in dependency order and keep unrelated files out of each commit;
          - add or update the automated proof with the outcome, run the narrow proof, then commit;
          - use a concise descriptive commit subject; never use fixup or squash commits;
          - do not amend, rebase, squash, or otherwise rewrite existing history.

          Stay on observe. Do not create, switch, or delete branches or worktrees. Do not push and
          do not create a pull request; the workflow owns publication. Before finishing, run
          bash tests/run-all.sh and leave a clean working tree with every implementation change
          committed.
          EOF
          )"

          copilot \
            --prompt "$PROMPT" \
            --model gpt-5.6-sol \
            --effort max \
            --allow-all-tools \
            --disable-builtin-mcps \
            --no-ask-user

      - name: Verify implementation and commit discipline
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "observe"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test -z "$(git status --porcelain)"

          mapfile -t commits < <(git rev-list --reverse "$BASE_SHA..HEAD")
          if (( ${#commits[@]} < 2 )); then
            echo "::error::The implementation must be split into multiple atomic outcome commits."
            exit 1
          fi

          for commit in "${commits[@]}"; do
            parent_count="$(
              git rev-list --parents -n 1 "$commit" |
                awk '{ print NF - 1 }'
            )"
            test "$parent_count" -eq 1
            subject="$(git log -1 --format=%s "$commit")"
            if [[ "$subject" == fixup\!* || "$subject" == squash\!* ]]; then
              echo "::error::Non-atomic history marker found in $commit: $subject"
              exit 1
            fi
          done

          test -f tests/run-all.sh
          bash tests/run-all.sh
          test -z "$(git status --porcelain)"

      - name: Package committed implementation
        id: package
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/observability.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/observability.bundle"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload committed implementation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-implementation-${{ github.run_id }}
          path: ${{ runner.temp }}/observability.bundle
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.validate.outputs.sha }}

    steps:
      - name: Check out observe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: observe
          fetch-depth: 0
          persist-credentials: false

      - name: Download committed implementation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: observability-implementation-${{ github.run_id }}
          path: ${{ runner.temp }}/implementation

      - name: Validate publication
        id: validate
        env:
          BASE_SHA: ${{ needs.implement.outputs.baseline_sha }}
          EXPECTED_HEAD: ${{ needs.implement.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"

          bundle="$RUNNER_TEMP/implementation/observability.bundle"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" HEAD:refs/remotes/agent/observability
          implemented_sha="$(git rev-parse refs/remotes/agent/observability)"
          test "$implemented_sha" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$BASE_SHA" "$implemented_sha"

          mapfile -t commits < <(git rev-list --reverse "$BASE_SHA..$implemented_sha")
          if (( ${#commits[@]} < 2 )); then
            echo "::error::The implementation does not contain multiple outcome commits."
            exit 1
          fi

          for commit in "${commits[@]}"; do
            parent_count="$(
              git rev-list --parents -n 1 "$commit" |
                awk '{ print NF - 1 }'
            )"
            test "$parent_count" -eq 1
            subject="$(git log -1 --format=%s "$commit")"
            if [[ "$subject" == fixup\!* || "$subject" == squash\!* ]]; then
              echo "::error::Non-atomic history marker found in $commit: $subject"
              exit 1
            fi
          done

          if ! git diff --quiet "$BASE_SHA..$implemented_sha" -- .github; then
            echo "::error::Agent 1 may not add or change GitHub control-plane files."
            exit 1
          fi
          if ! git diff --quiet "$BASE_SHA..$implemented_sha" -- \
            agents/pre-pr-reviewer.md skills/pre-pr-review; then
            echo "::error::Agent 1 may not change its independent reviewer or review skill."
            exit 1
          fi
          if ! git diff --quiet "$BASE_SHA..$implemented_sha" -- \
            .agents .claude .copilot .mcp.json AGENTS.md CLAUDE.md; then
            echo "::error::Agent 1 may not add project-level agent customization."
            exit 1
          fi

          git update-ref refs/heads/observability-result "$implemented_sha"
          echo "sha=$implemented_sha" >> "$GITHUB_OUTPUT"

      - name: Push implementation to observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(
            printf 'x-access-token:%s' "$GITHUB_TOKEN" |
              base64 |
              tr -d '\n'
          )"
          echo "::add-mask::$auth"
          git \
            -c core.hooksPath=/dev/null \
            -c "http.extraHeader=AUTHORIZATION: basic $auth" \
            push --no-verify \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            refs/heads/observability-result:refs/heads/observe

  review:
    needs: [implement, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      copilot-requests: write

    steps:
      - name: Check out implemented commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: |
          npm install --global @github/copilot@1.0.80
          copilot version

      - name: Prepare trusted reviewer
        env:
          BASE_SHA: ${{ needs.implement.outputs.baseline_sha }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          copilot_home="$RUNNER_TEMP/copilot-home"
          mkdir -p "$copilot_home/agents" "$copilot_home/skills"
          git show "$BASE_SHA:agents/pre-pr-reviewer.md" \
            > "$copilot_home/agents/pre-pr-reviewer.md"
          git archive "$BASE_SHA" skills/pre-pr-review |
            tar -x -C "$copilot_home"
          test -r "$copilot_home/agents/pre-pr-reviewer.md"
          test -r "$copilot_home/skills/pre-pr-review/SKILL.md"
          echo "COPILOT_HOME=$copilot_home" >> "$GITHUB_ENV"

      - name: Agent 2 - adversarial pre-PR review
        id: review
        continue-on-error: true
        env:
          BASE_SHA: ${{ needs.implement.outputs.baseline_sha }}
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PROMPT="$(cat <<EOF
          Review the implementation in ${BASE_SHA}..HEAD.

          The repository is at ${REPOSITORY_ROOT}. Your process starts from an isolated directory
          so the implementation cannot shadow your trusted skill or install hooks. Treat
          ${REPOSITORY_ROOT} as the repository root: use absolute paths or git -C for every read
          and probe, while reporting repository-relative file references.

          Original task: review docs/agent-traceability-design-assessment.md and implement its
          observability design on the observe branch using atomic, testable outcome commits.

          Definition of done: acceptance criteria A1-A11 and tests T1-T24 in
          docs/agent-traceability-design-assessment.md, with bash tests/run-all.sh passing.

          You are not given Agent 1's summary or session output. Do not seek either. Before writing
          any finding, invoke the pre-pr-review skill as required by your agent profile. Review the
          diff and surrounding code, run adversarial probes, fix nothing, and emit only the required
          evidence-backed report with its exact final verdict line.
          EOF
          )"

          mkdir -p "$RUNNER_TEMP/reviewer-cwd"
          cd "$RUNNER_TEMP/reviewer-cwd"
          copilot \
            --prompt "$PROMPT" \
            --silent \
            --agent pre-pr-reviewer \
            --model claude-opus-5 \
            --effort max \
            --add-dir "$REPOSITORY_ROOT" \
            --allow-all-tools \
            --disable-builtin-mcps \
            --no-custom-instructions \
            --no-ask-user |
            tee "$RUNNER_TEMP/pre-pr-review.md"

      - name: Publish review summary
        if: always()
        env:
          BASE_SHA: ${{ needs.implement.outputs.baseline_sha }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
        run: |
          {
            echo "## Observability implementation"
            echo
            echo "- Branch: \`observe\`"
            echo "- Baseline: \`${BASE_SHA:-unavailable}\`"
            echo "- Implemented head: \`${HEAD_SHA:-unavailable}\`"
            echo
            echo "### Outcome commits"
            if [[ -n "${BASE_SHA:-}" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git log --reverse --format='- `%h` %s' "$BASE_SHA..HEAD"
            else
              echo "- unavailable"
            fi
            echo
            echo "## Adversarial pre-PR review"
            echo
            if [[ -f "$RUNNER_TEMP/pre-pr-review.md" ]]; then
              cat "$RUNNER_TEMP/pre-pr-review.md"
            else
              echo "Reviewer produced no report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce review verdict
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          if [[ "$REVIEW_OUTCOME" != "success" ]]; then
            echo "::error::The pre-PR reviewer did not complete successfully."
            exit 1
          fi

          test -z "$(git status --porcelain)"
          report="$RUNNER_TEMP/pre-pr-review.md"
          test -s "$report"

          set +e
          python3 -I - "$report" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          tokens = re.findall(r"REVIEW: (?:CLEAR|BLOCKED)", text)
          lines = text.splitlines()
          verdicts = {"REVIEW: CLEAR", "REVIEW: BLOCKED"}
          if len(tokens) != 1 or not lines or lines[-1] not in verdicts:
              sys.exit(3)

          if not lines[0].startswith("REVIEW OF: ") or not lines[0][11:].strip():
              sys.exit(3)

          worked = next(
              (line for line in lines if line.startswith("LINES WORKED:")),
              "",
          )
          if not all(f"R{number}" in worked for number in range(1, 6)):
              sys.exit(3)

          blind_spots = next(
              (
                  line.partition(":")[2].strip()
                  for line in lines
                  if line.startswith("DoD BLIND SPOTS NAMED:")
              ),
              "",
          )
          if not blind_spots or blind_spots.startswith("<"):
              sys.exit(3)

          finding_pattern = re.compile(
              r"^F(\d+)\s+(BLOCKER|SHOULD FIX|NOTE)\s+\S"
          )
          findings = [
              (index, finding_pattern.match(line))
              for index, line in enumerate(lines)
              if finding_pattern.match(line)
          ]
          numbers = [int(match.group(1)) for _, match in findings]
          if numbers != list(range(1, len(numbers) + 1)):
              sys.exit(3)

          for position, (start, _) in enumerate(findings):
              end = (
                  findings[position + 1][0]
                  if position + 1 < len(findings)
                  else len(lines) - 1
              )
              block = lines[start:end]
              if not any(line.lstrip().startswith("Evidence:") for line in block):
                  sys.exit(3)

          severities = [match.group(2) for _, match in findings]
          if lines[-1] == "REVIEW: BLOCKED" and "BLOCKER" not in severities:
              sys.exit(3)
          if lines[-1] == "REVIEW: CLEAR" and "BLOCKER" in severities:
              sys.exit(3)
          sys.exit(0 if lines[-1] == "REVIEW: CLEAR" else 2)
          PY
          verdict_status=$?
          set -e

          case "$verdict_status" in
            0)
              echo "Pre-PR review is clear."
              ;;
            2)
              echo "::error::Pre-PR review blocked the change. See the job summary."
              exit 1
              ;;
            *)
              echo "::error::Reviewer output did not contain exactly one valid final verdict."
              exit 1
              ;;
          esac
